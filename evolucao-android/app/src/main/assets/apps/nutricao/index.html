<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<meta name="theme-color" content="#0d0d0f"/>
<link rel="manifest" href="manifest.webmanifest"/>
<title>NutriTrack</title>
<link rel="stylesheet" href="theme.css"/>
</head>
<body>
<div id="app">
  <header>
    <h1>
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="#f5a623" stroke-width="2"/><path d="M8 12c0-3 1.8-6 4-6s4 3 4 6-1.8 6-4 6-4-3-4-6z" fill="#f5a623" opacity=".85"/><path d="M4.5 15c1.5-2 4-2.5 7.5-.5M19.5 9c-1.5 2-4 2.5-7.5.5" stroke="#f5a623" stroke-width="1.4" stroke-linecap="round"/></svg>
      NutriTrack
    </h1>
    <p class="sub" id="dataHoje"></p>
  </header>

  <main id="main"></main>

  <nav id="nav">
    <button data-tab="hoje" class="on">
      <svg viewBox="0 0 24 24" fill="none"><path d="M3 12l9-9 9 9M5 10v9a1 1 0 001 1h4v-5h4v5h4a1 1 0 001-1v-9" stroke="#ececf0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>Hoje</span>
    </button>
    <button data-tab="diario">
      <svg viewBox="0 0 24 24" fill="none"><path d="M3 20h18M6 17V9M10 17V5M14 17v-6M18 17v-4" stroke="#ececf0" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Diário</span>
    </button>
    <button data-tab="alimentos">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M6 7v11a2 2 0 002 2h8a2 2 0 002-2V7M9 7V5a3 3 0 016 0v2" stroke="#ececf0" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Alimentos</span>
    </button>
    <button data-tab="metas">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="#ececf0" stroke-width="2"/><circle cx="12" cy="12" r="5" stroke="#ececf0" stroke-width="2"/><circle cx="12" cy="12" r="1.5" fill="#ececf0"/></svg>
      <span>Metas</span>
    </button>
    <button data-tab="ajustes">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 7h12M4 12h16M4 17h10" stroke="#ececf0" stroke-width="2" stroke-linecap="round"/><circle cx="19" cy="7" r="2.5" stroke="#ececf0" stroke-width="2"/><circle cx="15" cy="12" r="2.5" stroke="#ececf0" stroke-width="2"/><circle cx="17" cy="17" r="2.5" stroke="#ececf0" stroke-width="2"/></svg>
      <span>Ajustes</span>
    </button>
  </nav>
</div>

<div class="modal-back" id="modalBack"><div class="modal" id="modal"></div></div>
<div id="toast"></div>

<script src="estado.js"></script>
<script src="referencia.js"></script>
<script src="logic.js"></script>
<script src="nav.js"></script>
<script src="../../core/gemini.js"></script>
<script src="views/hoje.js"></script>
<script src="views/diario.js"></script>
<script src="views/alimentos.js"></script>
<script src="views/metas.js"></script>
<script src="views/ajustes.js"></script>
<script>render()</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NutriTrack">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>NutriTrack — Nutrição</title>
<script src="appearance.js"></script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="design.css">
<link rel="stylesheet" href="launch.css">
</head>
<body>
<script src="launch.js"></script>
<div id="app">
  <header>
    <div class="hin">
      <div class="brand">
        <span class="logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M12 3a9 9 0 1 1-9 9" stroke-width="2.2"/>
            <path d="M12 6.5a5.5 5.5 0 1 1-4.76 2.75" stroke-width="2.2"/>
            <path d="M12 10a2 2 0 1 1-2 2" stroke-width="2.2"/>
          </svg>
        </span>
        NutriTrack
      </div>
      <div class="header-actions"><div class="wk" id="dataHoje"></div><button class="icon-button" id="btnAjustes" aria-label="Ajustes" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="var(--bg)"/><circle cx="15" cy="17" r="3" fill="var(--bg)"/></svg></button></div>
    </div>
  </header>

  <main id="main"></main>

  <div class="registration-bar"><button class="bigbtn primary" id="btnRegistrar">+ Registrar refeição</button></div>
  <nav id="nav" aria-label="Navegação principal">
    <button data-tab="hoje" class="on">
      <span class="ico">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M3 12l9-9 9 9M5 10v9a1 1 0 001 1h4v-5h4v5h4a1 1 0 001-1v-9"/>
        </svg>
      </span>
      <span>Hoje</span>
    </button>
    <button data-tab="diario">
      <span class="ico">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M3 20h18M6 17V9M10 17V5M14 17v-6M18 17v-4"/>
        </svg>
      </span>
      <span>Histórico</span>
    </button>
    <button data-tab="alimentos">
      <span class="ico">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M4 7h16M6 7v11a2 2 0 002 2h8a2 2 0 002-2V7M9 7V5a3 3 0 016 0v2"/>
        </svg>
      </span>
      <span>Alimentos</span>
    </button>
    <button data-tab="metas">
      <span class="ico">
        <svg viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="9"/>
          <circle cx="12" cy="12" r="5"/>
          <circle cx="12" cy="12" r="1.5" fill="currentColor"/>
        </svg>
      </span>
      <span>Metas</span>
    </button>

  </nav>
</div>

<dialog class="dlg-back modal-back" id="modalBack" aria-label="Formulário do NutriTrack"><div class="modal-frame"><div class="modal-toolbar"><button class="icon-button" onclick="closeModal()" aria-label="Fechar formulário"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div><div class="dlg modal" id="modal"></div></div></dialog>
<div id="toast"></div>

<script src="estado.js"></script>
<script src="referencia.js"></script>
<script src="logic.js"></script>
<script src="nav.js"></script>
<script src="../../core/gemini-models.js"></script>
<script src="../../core/gemini.js"></script>
<script src="views/hoje.js"></script>
<script src="views/diario.js"></script>
<script src="views/alimentos.js"></script>
<script src="views/metas.js"></script>
<script src="views/ajustes.js"></script>
<script>render()</script>
</body>
</html>

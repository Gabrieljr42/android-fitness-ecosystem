org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Workspace path contains non-ASCII characters ("Área de Trabalho").
# AGP blocks this by default on Windows; both sibling apps already ship APKs
# built from this same path family, so the official override is adopted.
android.overridePathCheck=true
# No daemon / no VFS: keeps every invocation self-contained and avoids
# orphaned processes holding terminal streams open on this workspace.
org.gradle.daemon=false
org.gradle.vfs.watch=false
# Compile in the Gradle process: avoids orphaned Kotlin daemons and preserves
# non-ASCII Windows workspace paths in both OpenCode and sandboxed CI runners.
kotlin.compiler.execution.strategy=in-process
